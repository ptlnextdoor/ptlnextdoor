name: Check README links

on:
  schedule:
    # Daily at 08:30 UTC, just after the waka refresh.
    - cron: '30 8 * * *'
  push:
    paths: ['README.md']
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check every URL in README
        run: |
          set -uo pipefail
          grep -oE 'https://[^"<>) ]+' README.md | sort -u > urls.txt
          : > dead.txt

          probe() {
            curl -s -o /dev/null -w '%{http_code}' -L --max-time 25 \
                 -H 'User-Agent: Mozilla/5.0' "$1" || echo 000
          }

          while read -r u; do
            code=$(probe "$u")
            # One retry: transient failures shouldn't file an issue.
            if [ "$code" != "200" ]; then sleep 5; code=$(probe "$u"); fi

            # Some CDNs (simpleicons) serve 403 to GitHub runner IPs while
            # serving 200 to browsers. Only a body check tells them apart
            # from a genuinely dead asset.
            if [ "$code" = "403" ]; then
              bytes=$(curl -s -L --max-time 25 -H 'User-Agent: Mozilla/5.0' "$u" | wc -c)
              [ "$bytes" -gt 100 ] && code=200
            fi

            [ "$code" = "200" ] || echo "$code $u" >> dead.txt
          done < urls.txt

          if [ -s dead.txt ]; then
            echo "Dead links:"; cat dead.txt
            exit 1
          fi
          echo "All $(wc -l < urls.txt) URLs OK."

      - name: Open an issue when links are dead
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [ -s dead.txt ] || exit 0
          {
            echo 'These URLs in `README.md` are not returning 200:'
            echo
            echo '```'
            cat dead.txt
            echo '```'
            echo
            echo 'A `404` on a `github.com/ptlnextdoor/*` link usually means that repo'
            echo 'flipped to private. Either make it public again, or move it into the'
            echo '"Private, and the reason the rest of this reads the way it does"'
            echo 'section so visitors read a name instead of hitting a 404.'
          } > body.md

          existing=$(gh issue list --state open --label dead-link \
                     --json number --jq '.[0].number' || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file body.md
          else
            gh label create dead-link --color d73a4a \
              --description "README links returning non-200" 2>/dev/null || true
            gh issue create --title "Dead links in profile README" \
              --label dead-link --body-file body.md
          fi
